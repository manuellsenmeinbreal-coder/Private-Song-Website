<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glassbox – Musik für die Community</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="disc-bg" aria-hidden="true"></div>

<div class="app">
  <aside class="side glass">
    <div class="brand">Glassbox</div>
    <div class="user" id="user"></div>
    <button class="item" id="libBtn"><span>Alle Songs</span><small id="libCount"></small></button>
    <button class="item" id="favBtn"><span>Favoriten</span><small id="favCount"></small></button>
    <button class="item" id="repBtn" hidden><span>Meldungen</span><small id="repCount"></small></button>
    <h2>Deine Playlists</h2>
    <div id="lists"></div>
    <form class="newlist" id="newForm">
      <input type="text" id="newName" placeholder="Neue Playlist" maxlength="40" aria-label="Name der neuen Playlist">
      <button class="ib" title="Playlist anlegen" aria-label="Playlist anlegen" id="newBtn"></button>
    </form>
    <h2 id="pubHead" hidden>Community-Playlists</h2>
    <div id="publicLists"></div>
    <p class="mark">erstellt von that.manu</p>
  </aside>

  <main class="main glass">
    <div class="head">
      <div><h1 id="title"></h1><p id="sub"></p></div>
      <div class="actions" id="actions"></div>
    </div>
    <input type="search" class="search" id="search" placeholder="Songs durchsuchen" aria-label="Songs durchsuchen">
    <div class="songs" id="songs"></div>
    <div class="stage" aria-hidden="true"><canvas class="viz" id="viz" width="1000" height="1000"></canvas><div class="disc"></div></div>
  </main>

  <footer class="player glass">
    <div class="now"><div class="art" id="art"></div><div class="txt"><b id="curTitle">Keine Wiedergabe</b><span id="curSub">Wähle einen Song</span></div></div>
    <div class="center">
      <div class="ctrl">
        <button class="ib" id="shuf" title="Zufallswiedergabe" aria-label="Zufallswiedergabe" aria-pressed="false"></button>
        <button class="ib" id="prev" title="Vorheriger Song" aria-label="Vorheriger Song"></button>
        <button class="ib play" id="pp" title="Abspielen" aria-label="Abspielen"></button>
        <button class="ib" id="next" title="Nächster Song" aria-label="Nächster Song"></button>
      </div>
      <div class="bar"><span id="ct">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Fortschritt"><span id="dt">0:00</span></div>
    </div>
    <div class="right">
      <button class="sw" id="ap" role="switch" aria-checked="true"><i></i>Autoplay</button>
      <label class="vol"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16 8.5a5 5 0 010 7l-1.2-1.2a3.3 3.3 0 000-4.6zM18.4 6.1a8.4 8.4 0 010 11.8l-1.2-1.2a6.7 6.7 0 000-9.4z"/></svg><input type="range" id="vol" min="0" max="100" value="80" aria-label="Lautstärke"></label>
    </div>
  </footer>
</div>

<div class="drop" id="drop"><div>Audiodateien ablegen<br><small>Bild auf einen Song ziehen = Cover</small></div></div>
<input type="file" id="img" accept="image/*" hidden>
<input type="file" id="file" accept="audio/*,.mp3,.m4a,.wav,.ogg,.flac" multiple hidden>

<dialog class="dlg" id="authDlg">
  <h2>Anmelden</h2>
  <input type="text" id="aName" placeholder="Benutzername (nur für neues Konto)" autocomplete="username" maxlength="20">
  <input type="email" id="aMail" placeholder="E-Mail" autocomplete="email">
  <input type="password" id="aPass" placeholder="Passwort (mind. 6 Zeichen)" autocomplete="current-password">
  <p class="msg" id="aMsg"></p>
  <div class="btns"><button class="pill" id="aUp">Konto erstellen</button><button class="pill main-cta" id="aIn">Anmelden</button></div>
</dialog>
<dialog class="dlg" id="upDlg">
  <h2>Songs veröffentlichen</h2>
  <p class="msg" id="upList"></p>
  <label class="chk"><input type="checkbox" id="rights"> Ich habe die Rechte an diesen Songs (eigene Musik oder ausdrücklich erlaubt) und erlaube die öffentliche Wiedergabe.</label>
  <div class="btns"><button class="pill" id="upCancel">Abbrechen</button><button class="pill main-cta" id="upGo" disabled>Hochladen</button></div>
</dialog>
<dialog class="dlg wide" id="cDlg">
  <h2 id="cTitle">Kommentare</h2>
  <div class="clist" id="cList"></div>
  <form class="cform" id="cForm">
    <input type="text" id="cInput" placeholder="Kommentar schreiben …" maxlength="500" aria-label="Kommentar schreiben">
    <button class="pill main-cta" type="submit">Senden</button>
  </form>
  <div class="btns"><button class="pill" id="cClose">Schließen</button></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
